# SonarQube Cloud analysis, run from the "sonar" job in .github/workflows/ci.yml.
# Coverage reports are produced by the other CI jobs and downloaded before the scan.
sonar.projectKey=memearr_meme-arr
sonar.organization=memearr

sonar.sources=.
sonar.exclusions=target/**,web/node_modules/**,web/dist/**,web/coverage/**,dev/mock/media/**,assets/**

# Files that are tests rather than product code (kept out of coverage and duplication counts).
sonar.test.inclusions=tests/**,**/*.test.js,**/*.test.jsx,**/*_tests.rs,**/test_*.py
sonar.coverage.exclusions=tests/**,**/*.test.js,**/*.test.jsx,**/*_tests.rs,**/test_*.py,dev/**

# Rust: cargo llvm-cov --lcov (backend job).  Web: vitest --coverage, paths rewritten to web/src
# in the sonar job.  Python scripts: coverage.py XML (docs job).
sonar.rust.lcov.reportPaths=lcov.info
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
