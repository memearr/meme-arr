name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Everything runs on GitHub-hosted Linux runners, so it also works for pull
# requests from forks. The jobs are independent; the Docker job builds the
# image once the code checks pass.
jobs:
  # The wiki is generated from docs/ (scripts/sync_wiki.py); this keeps every
  # doc mapped to a page and every relative link in the docs resolvable.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Run under coverage.py so the "sonar" job can report coverage of the scripts.
      - name: Test the scripts
        run: |
          python3 -m pip install --only-binary :all: coverage==7.17.4
          python3 -m coverage run -m unittest discover -s scripts -v
          python3 -m coverage xml -o coverage.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: error

  backend:
    # The pipeline tests run the same ffmpeg the image ships (ghcr.io/memearr/ffmpeg,
    # built from docker/ffmpeg/Dockerfile on debian:trixie), not a distro package:
    # ubuntu-24.04's ffmpeg is 6.1 and ubuntu-latest's is 8.0.1, which prints "Error
    # parsing Opus packet header" on our WebM sequence output. That build needs
    # trixie's glibc (2.41), so this runs on ubuntu-latest, whose glibc is newer.
    runs-on: ubuntu-latest
    # If an ffmpeg-backed test ever hangs, fail in minutes, not hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The pipeline tests run the real ffmpeg; they skip themselves silently
      # without it, so install it and then fail loudly if it is missing.
      # (gifsicle is optional: the export path skips GIF optimisation without it.)
      - name: Install gifsicle and the fonts ffmpeg's text filters use
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gifsicle fontconfig fonts-dejavu-core
      - name: Get the image's ffmpeg
        run: |
          version=$(sed -n 's/^ARG FFMPEG_VERSION=//p' docker/ffmpeg/Dockerfile)
          # The image and the Dockerfile that uses it must name the same version.
          test "$version" = "$(sed -n 's/^ARG FFMPEG_VERSION=//p' Dockerfile | head -1)"
          cid=$(docker create "ghcr.io/${{ github.repository_owner }}/ffmpeg:$version" /nonexistent)
          sudo docker cp "$cid:/opt/ffmpeg" /opt/ffmpeg
          docker rm "$cid"
          echo /opt/ffmpeg/bin >> "$GITHUB_PATH"
      - name: Require ffmpeg
        run: |
          ffmpeg -version | head -1 | grep -F "ffmpeg version 9."
          ffprobe -version | head -1
          ! ldd /opt/ffmpeg/bin/ffmpeg | grep "not found"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # One ffmpeg run in these tests takes seconds; if one hangs, stop it after two minutes
        # with an error that names the test, instead of the job dying silently at 20.
        env:
          MEMEARR_FFMPEG_TIMEOUT_SECS: "120"
        # Same tests, built with coverage instrumentation; lcov.info goes to the "sonar" job.
        run: cargo llvm-cov --all --lcov --output-path lcov.info --ignore-filename-regex '(^|/)tests/|_tests\.rs$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: lcov.info
          if-no-files-found: error

  # Fails the build on any known-vulnerable crate in Cargo.lock, so an advisory
  # shows up in the PR itself instead of only on the repo's Security tab.
  # Reviewed exceptions (each with its justification) live in .cargo/audit.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Test and build SPA
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run coverage
          npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: web/coverage/lcov.info
          if-no-files-found: error
      # What ships in the app (the built SPA's runtime dependencies) must be clean.
      - name: npm audit, shipped dependencies (fail on high/critical)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      # Dev tools (vite, vitest, ...) never reach users, and some advisories there have no
      # patch yet, so they are reported in the log but don't fail the build.
      - name: npm audit, dev tools (report only)
        working-directory: web
        continue-on-error: true
        run: npm audit --audit-level=high

  # SonarQube Cloud analysis with the coverage reports from the jobs above. It needs the
  # SONAR_TOKEN repository secret, which forks and Dependabot don't get, so the scan
  # is skipped (not failed) when the secret is missing. Settings: sonar-project.properties.
  sonar:
    runs-on: ubuntu-latest
    needs: [docs, backend, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check for the SonarQube Cloud token
        id: token
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "SONAR_TOKEN is not available here; skipping the scan."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0 # the scan needs full history to attribute new code
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: coverage-rust
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: coverage-python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: coverage-web
          path: web/coverage
      # vitest writes paths relative to web/; the scan runs from the repository root.
      - name: Make the web report paths repository-relative
        if: steps.token.outputs.present == 'true'
        run: sed -i 's#^SF:src/#SF:web/src/#' web/coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        if: steps.token.outputs.present == 'true'

  # Builds the image with the same actions the release workflow uses (minus the
  # registry login/push), so a breaking action upgrade fails on a PR rather
  # than on the next tag, then smoke-tests it.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check image metadata inputs
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: meme-arr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The non-root entrypoint is exercised here, so this replays the actual
      # upgrade path: a volume an older, root-running image already wrote to,
      # then the new default on it.
      - name: Smoke-test non-root runtime and upgrade from a root-owned volume
        run: |
          set -eu
          img=meme-arr:ci
          wait_healthy() {
            for _ in $(seq 1 60); do
              curl -fs http://localhost:8080/healthz >/dev/null && return 0
              sleep 1
            done
            docker logs smoke
            return 1
          }
          docker volume create memearr-data

          # 1. Old behavior (PUID=0 keeps running as root) leaves a root-owned DB.
          docker run -d --name smoke -p 8080:8080 -v memearr-data:/data \
            -e PUID=0 -e INDEX_ON_START=false "$img"
          wait_healthy
          docker rm -f smoke
          owner=$(docker run --rm -v memearr-data:/data --entrypoint stat "$img" -c %u /data/index.sqlite3)
          [ "$owner" = 0 ] || { echo "expected a root-owned DB to start from, got uid $owner"; exit 1; }

          # 2. The new default on that same volume: chown, drop to 1000, keep working.
          docker run -d --name smoke -p 8080:8080 -v memearr-data:/data \
            -e INDEX_ON_START=false "$img"
          wait_healthy
          uid=$(docker exec smoke grep '^Uid:' /proc/1/status | cut -f2)
          [ "$uid" = 1000 ] || { echo "PID 1 runs as uid $uid, expected 1000"; exit 1; }
          owner=$(docker exec smoke stat -c %u /data/index.sqlite3)
          [ "$owner" = 1000 ] || { echo "DB still owned by uid $owner"; exit 1; }
          # A real DB write as the non-root user (first-run admin password setup).
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/setup \
            -H 'Content-Type: application/json' -d '{"password":"ci-smoke-test"}')
          [ "$code" = 200 ] || { echo "setup returned $code"; docker logs smoke; exit 1; }

          # 3. The Dockerfile's own HEALTHCHECK command has to work in this image.
          docker exec smoke /bin/sh -c 'wget -qO- http://localhost:8080/healthz'

          # 4. Subtitle burn-in (libass + fontconfig) as the non-root user -- the
          #    export path most likely to trip over a missing writable home.
          docker exec -u 1000:1000 -e HOME=/tmp smoke sh -c '
            printf "1\n00:00:00,000 --> 00:00:01,000\nhello\n" > /tmp/t.srt &&
            ffmpeg -v error -f lavfi -i testsrc=duration=1:size=320x240 \
              -vf "subtitles=/tmp/t.srt:fontsdir=/app/fonts" -frames:v 5 -y /tmp/t.mp4'
          docker rm -f smoke
